<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Elevator Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .dashboard { display: flex; gap: 20px; flex-wrap: wrap;}
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; flex: 1; min-width: 300px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: center; }
        th { background: #f8f9fa; }
        .chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px;}
    </style>
</head>
<body>
    <h1>エレベーター管理システム</h1>
    
    <div class="dashboard">
        <div class="card">
            <h3>現在の混雑度</h3>
            <table id="congestionTable">
                <thead><tr><th>階/ID</th><th>レベル</th><th>更新時刻</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="card">
            <h3>現在の環境</h3>
            <table id="envTable">
                <thead><tr><th>ID</th><th>温度</th><th>湿度</th><th>気圧</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <h2>過去データ分析</h2>
    <div>
        <select id="rangeSelect" onchange="fetchHistory()">
            <option value="day">今日 (詳細)</option>
            <option value="week">今週 (1時間平均)</option>
            <option value="month">今月 (5分平均)</option>
        </select>
        <input type="date" id="dateInput" onchange="fetchHistory()">
    </div>

    <div class="chart-container">
        <canvas id="mainChart"></canvas>
    </div>

    <script>
        // 初期設定
        const ctx = document.getElementById('mainChart').getContext('2d');
        let mainChart = new Chart(ctx, {
            type: 'line',
            data: { datasets: [] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { type: 'time', time: { unit: 'minute', displayFormats: { minute: 'HH:mm' } } },
                    y: { beginAtZero: true }
                },
                interaction: { mode: 'nearest', intersect: false }
            }
        });

        // 今日の日付をセット
        document.getElementById('dateInput').valueAsDate = new Date();

        // リアルタイムデータ取得
        async function fetchRealtime() {
            try {
                const [congRes, envRes] = await Promise.all([
                    fetch('/api/congestion/latest'),
                    fetch('/api/environment/latest')
                ]);
                const congData = await congRes.json();
                const envData = await envRes.json();

                // 混雑度テーブル更新
                const cTbody = document.querySelector('#congestionTable tbody');
                cTbody.innerHTML = congData.map(d => 
                    `<tr><td>${d.floor_number || d.device_id}</td><td>${d.congestion_level}</td><td>${new Date(d.measured_at).toLocaleTimeString()}</td></tr>`
                ).join('');

                // 環境テーブル更新
                const eTbody = document.querySelector('#envTable tbody');
                eTbody.innerHTML = envData.map(d => 
                    `<tr><td>${d.device_id}</td><td>${d.temperature.toFixed(1)}℃</td><td>${d.humidity.toFixed(1)}%</td><td>${d.pressure.toFixed(0)}hPa</td></tr>`
                ).join('');
            } catch(e) { console.error(e); }
        }

        // 履歴データ取得とグラフ描画
        async function fetchHistory() {
            const range = document.getElementById('rangeSelect').value;
            const date = document.getElementById('dateInput').value;
            const res = await fetch(`/api/history?range=${range}&date=${date}`);
            const json = await res.json();
            const data = json.data;

            // データセットを作成
            const datasets = [];

            // 1. 混雑度
            const congData = data.filter(d => d.congestion_level !== null);
            datasets.push({
                label: '混雑度',
                data: congData.map(d => ({x: d.measured_at, y: d.congestion_level})),
                borderColor: 'rgb(255, 99, 132)',
                yAxisID: 'y'
            });

            // 2. 温度
            const tempData = data.filter(d => d.temperature !== null);
            datasets.push({
                label: '温度 (℃)',
                data: tempData.map(d => ({x: d.measured_at, y: d.temperature})),
                borderColor: 'rgb(54, 162, 235)',
                yAxisID: 'y'
            });
            
            mainChart.data.datasets = datasets;
            mainChart.update();
        }

        // 定期実行
        fetchRealtime();
        fetchHistory();
        setInterval(fetchRealtime, 5000); // 5秒ごとに更新
    </script>
</body>
</html>
