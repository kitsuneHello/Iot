<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>エレベーター管理システム</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --main-bg: #f7f9fb;
            --card-bg: #fff;
            --accent: #1976d2;
            --accent-light: #e3f2fd;
            --border: #e0e0e0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', 'Meiryo', sans-serif;
            margin: 0;
            background: var(--main-bg);
            color: #222;
        }

        h1 {
            margin: 0 0 24px 0;
            padding: 32px 0 16px 0;
            text-align: center;
            background: linear-gradient(90deg, var(--accent-light) 0%, #fff 100%);
            color: var(--accent);
            font-size: 2.2rem;
            letter-spacing: 2px;
            box-shadow: var(--shadow);
        }

        h2 {
            margin-top: 40px;
            color: var(--accent);
            font-size: 1.4rem;
            border-left: 6px solid var(--accent);
            padding-left: 12px;
        }

        h3,
        h4 {
            color: #333;
            margin-top: 18px;
            margin-bottom: 10px;
        }

        .realtime {
            display: flex;
            gap: 32px;
            margin: 0 0 32px 0;
            flex-wrap: wrap;
        }

        .realtime>div {
            flex: 1;
            min-width: 320px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 18px 10px 18px;
            border: 1px solid var(--border);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            margin-bottom: 18px;
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
        }

        th,
        td {
            border-bottom: 1px solid var(--border);
            padding: 10px 8px;
            text-align: center;
        }

        th {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: #f1f8ff;
        }

        .download-btn {
            margin-bottom: 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 10px 28px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(25, 118, 210, 0.08);
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: #125ea9;
        }

        .scrollable-table {
            max-height: 340px;
            overflow-y: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: #fff;
        }

        #tableArea {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 18px 10px 18px;
            margin-top: 18px;
            border: 1px solid var(--border);
        }

        /* グラフの最小高さを確保（レスポンシブ時の見栄え向上） */
        canvas {
            min-height: 220px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
            margin-bottom: 10px;
        }

        /* グラフとテーブルのレイアウト */
        @media (max-width: 1100px) {
            .realtime {
                flex-direction: column;
            }

            .realtime>div {
                min-width: unset;
            }
        }

        @media (max-width: 900px) {
            #tableArea,
            .realtime>div {
                padding: 10px 4px 6px 4px;
            }
        }

        @media (max-width: 700px) {
            .realtime,
            #tableArea>div {
                flex-direction: column;
                gap: 12px;
            }

            .download-btn {
                width: 100%;
            }
        }

        select,
        input[type="date"] {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 1rem;
            margin-left: 4px;
            margin-right: 8px;
        }

        label {
            font-weight: 500;
            color: #333;
        }

        /* スクロールバー美化 */
        ::-webkit-scrollbar {
            width: 8px;
            background: #f0f0f0;
        }

        ::-webkit-scrollbar-thumb {
            background: #b3c6e0;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h1>エレベーター管理システム</h1>
    <h2>リアルタイム情報</h2>
    <div class="realtime">
        <div>
            <h3>各階の最新混雑度</h3>
            <div class="scrollable-table">
                <table id="congestion-table">
                    <thead>
                        <tr>
                            <th>階</th>
                            <th>混雑度</th>
                            <th>時刻</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div>
            <h3>最新エレベーター環境</h3>
            <div class="scrollable-table">
                <table id="env-table">
                    <thead>
                        <tr>
                            <th>デバイス</th>
                            <th>気圧</th>
                            <th>温度</th>
                            <th>湿度</th>
                            <th>時刻</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <h2>過去データ</h2>
    <div>
        <button class="download-btn" onclick="downloadCSV()">CSVダウンロード</button>
        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
            <div style="flex:1; min-width:300px;">
                <h4>混雑度</h4>
                <canvas id="congestionChart" height="220"></canvas>
            </div>
            <div style="flex:1; min-width:300px;">
                <h4>気圧</h4>
                <canvas id="pressureChart" height="220"></canvas>
            </div>
            <div style="flex:1; min-width:300px;">
                <h4>温度</h4>
                <canvas id="tempChart" height="220"></canvas>
            </div>
            <div style="flex:1; min-width:300px;">
                <h4>湿度</h4>
                <canvas id="humChart" height="220"></canvas>
            </div>
            <div style="flex:1; min-width:300px;">
                <h4>事故情報</h4>
                <canvas id="accidentChart" height="220"></canvas>
            </div>
        </div>
        <div style="margin: 10px 0;">
            <label>表示範囲:
                <select id="rangeSelect" onchange="fetchHistory()">
                    <option value="day">日</option>
                    <option value="week">週</option>
                    <option value="month">月</option>
                    <option value="all">全期間</option>
                </select>
                <input type="date" id="dateInput" value="" onchange="fetchHistory()">
            </label>
        </div>
        <div id="tableArea">
            <h4>混雑度</h4>
            <div id="congestionTableContainer" class="scrollable-table"></div>
            <h4>環境データ</h4>
            <div id="environmentTableContainer" class="scrollable-table"></div>
            <h4>事故情報</h4>
            <div id="accidentTableContainer" class="scrollable-table"></div>
        </div>
    </div>

    <script>
        // 日時をISO8601に変換
        function toISO(dt) {
            return dt ? dt.replace(' ', 'T') : dt;
        }

        // 色を生成（インデックスから一巡する HSL ベース）
        function getColor(i) {
            const hue = (i * 45) % 360;
            return `hsl(${hue} 75% 45%)`;
        }

        // リアルタイムデータ取得
        async function fetchRealtime() {
            const [congestion, env] = await Promise.all([
                fetch('/api/congestion/latest').then(r => r.json()),
                fetch('/api/environment/latest').then(r => r.json())
            ]);

            // 混雑度
            const ct = document.querySelector('#congestion-table tbody');
            ct.innerHTML = congestion.map(row => `<tr><td>${row.floor_number}</td><td>${row.congestion_level}</td><td>${row.measured_at}</td></tr>`).join('');
            document.querySelector('#congestion-table').parentElement.classList.toggle('scrollable-table', congestion.length > 30);

            // 環境
            const et = document.querySelector('#env-table tbody');
            et.innerHTML = env.map(row => `<tr><td>${row.device_id}</td><td>${row.pressure}</td><td>${row.temperature}</td><td>${row.humidity}</td><td>${row.measured_at}</td></tr>`).join('');
            document.querySelector('#env-table').parentElement.classList.toggle('scrollable-table', env.length > 30);
        }

        // グラフの初期化
        let congestionChart, pressureChart, tempChart, humChart, accidentChart;

        function initCharts() {
            const ctxCongestion = document.getElementById('congestionChart').getContext('2d');
            const ctxPressure = document.getElementById('pressureChart').getContext('2d');
            const ctxTemp = document.getElementById('tempChart').getContext('2d');
            const ctxHum = document.getElementById('humChart').getContext('2d');
            const ctxAccident = document.getElementById('accidentChart').getContext('2d');

            // 24時間表記ツールチップタイトル
            function tooltipTitle24Hour(items) {
                const v = items[0].parsed.x || items[0].label;
                const d = new Date(v);
                return d.toLocaleString('ja-JP', { hour12: false });
            }

            congestionChart = new Chart(ctxCongestion, {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    scales: {
                        x: { type: 'time' },
                        y: {
                            min: 0,
                            max: 1,
                            beginAtZero: true,
                            ticks: { stepSize: 0.1 }
                        }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                title: tooltipTitle24Hour
                            }
                        }
                    }
                }
            });

            pressureChart = new Chart(ctxPressure, {
                type: 'line',
                data: { labels: [], datasets: [{ label: '気圧', data: [], borderColor: 'green', fill: false }] },
                options: {
                    responsive: true,
                    scales: { x: { type: 'time' }, y: { beginAtZero: true } },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: tooltipTitle24Hour
                            }
                        }
                    }
                }
            });

            tempChart = new Chart(ctxTemp, {
                type: 'line',
                data: { labels: [], datasets: [{ label: '温度', data: [], borderColor: 'red', fill: false }] },
                options: {
                    responsive: true,
                    scales: { x: { type: 'time' }, y: { beginAtZero: true } },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: tooltipTitle24Hour
                            }
                        }
                    }
                }
            });

            humChart = new Chart(ctxHum, {
                type: 'line',
                data: { labels: [], datasets: [{ label: '湿度', data: [], borderColor: 'purple', fill: false }] },
                options: {
                    responsive: true,
                    scales: { x: { type: 'time' }, y: { beginAtZero: true } },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: tooltipTitle24Hour
                            }
                        }
                    }
                }
            });

            accidentChart = new Chart(ctxAccident, {
                type: 'scatter',
                data: { labels: [], datasets: [{ 
                    label: '事故件数', 
                    data: [], 
                    backgroundColor: 'orange', 
                    pointRadius: 6, 
                    showLine: false 
                }] },
                options: {
                    responsive: true,
                    scales: { x: { type: 'time' }, y: { beginAtZero: true, suggestedMax: 1, ticks: { stepSize: 1 } } },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: tooltipTitle24Hour,
                                label: function(context) {
                                    // 事故種別を追加表示
                                    const accidentTable = context.chart.data.datasets[0].accidentTable || [];
                                    const idx = context.dataIndex;
                                    const type = accidentTable[idx] && accidentTable[idx].accident_type ? accidentTable[idx].accident_type : '';
                                    return type ? `事故種別: ${type}` : '';
                                }
                            }
                        }
                    }
                }
            });
        }

        // 過去データ取得
        async function fetchHistory() {
            const range = document.getElementById('rangeSelect').value;
            const date = document.getElementById('dateInput').value;
            let url = `/api/history`;
            if (range && date) {
                url += `?range=${range}&date=${date}`;
            }
            const res = await fetch(url);
            const result = await res.json();
            const data = result.data;

            // 混雑度
            const congestion = data.filter(row => row.congestion_level !== undefined && row.congestion_level !== null);
            const congestionHtml = `<table><thead><tr><th>階/デバイス</th><th>混雑度</th><th>時刻</th></tr></thead><tbody>` +
                congestion.map(row => `<tr><td>${row.device_id || row.floor_number}</td><td>${row.congestion_level !== undefined && row.congestion_level !== null ? Number(row.congestion_level).toFixed(2) : ''}</td><td>${row.measured_at}</td></tr>`).join('') +
                `</tbody></table>`;
            document.getElementById('congestionTableContainer').innerHTML = congestionHtml;
            document.getElementById('congestionTableContainer').classList.toggle('scrollable-table', congestion.length > 30);

            // 環境データ
            const environment = data.filter(row => row.pressure !== undefined && row.pressure !== null);
            const environmentHtml = `<table><thead><tr><th>デバイス</th><th>気圧</th><th>温度</th><th>湿度</th><th>時刻</th></tr></thead><tbody>` +
                environment.map(row => `<tr><td>${row.device_id}</td><td>${row.pressure !== undefined && row.pressure !== null ? Number(row.pressure).toFixed(2) : ''}</td><td>${row.temperature !== undefined && row.temperature !== null ? Number(row.temperature).toFixed(2) : ''}</td><td>${row.humidity !== undefined && row.humidity !== null ? Number(row.humidity).toFixed(2) : ''}</td><td>${row.measured_at}</td></tr>`).join('') +
                `</tbody></table>`;
            document.getElementById('environmentTableContainer').innerHTML = environmentHtml;
            document.getElementById('environmentTableContainer').classList.toggle('scrollable-table', environment.length > 30);

            // 事故情報
            const accidentTable = data.filter(row => row.accident_type !== undefined && row.accident_type !== null && row.occurred_at);
            const accidentHtml = `<table><thead><tr><th>デバイス</th><th>事故種別</th><th>発生時刻</th></tr></thead><tbody>` +
                accidentTable.map(row => `<tr><td>${row.device_id}</td><td>${row.accident_type}</td><td>${row.occurred_at}</td></tr>`).join('') +
                `</tbody></table>`;
            document.getElementById('accidentTableContainer').innerHTML = accidentHtml;
            document.getElementById('accidentTableContainer').classList.toggle('scrollable-table', accidentTable.length > 30);

            // グラフデータ更新
            // 階ごとにグループ化して datasets を作成（floor_number または device_id をキーに）
            const keyGetter = r => (r.floor_number !== undefined && r.floor_number !== null) ? `階 ${r.floor_number}` : (r.device_id || 'unknown');
            const groups = {};
            congestion.forEach(r => {
                const k = keyGetter(r);
                groups[k] = groups[k] || [];
                groups[k].push(r);
            });
            const datasets = Object.keys(groups).map((k, idx) => {
                const points = groups[k]
                    .map(r => ({ x: toISO(r.measured_at), y: Number(r.congestion_level) }))
                    .sort((a, b) => new Date(a.x) - new Date(b.x));
                const color = getColor(idx);
                return {
                    label: k,
                    data: points,
                    borderColor: color,
                    backgroundColor: color,
                    spanGaps: true,
                    tension: 0.2,
                    fill: false,
                    borderWidth: 2,
                    pointRadius: 2
                };
            });
            congestionChart.data.datasets = datasets;
            congestionChart.update();

            pressureChart.data.labels = environment.map(row => row.measured_at);
            pressureChart.data.datasets[0].data = environment.map(row => row.pressure);
            pressureChart.update();

            tempChart.data.labels = environment.map(row => row.measured_at);
            tempChart.data.datasets[0].data = environment.map(row => row.temperature);
            tempChart.update();

            humChart.data.labels = environment.map(row => row.measured_at);
            humChart.data.datasets[0].data = environment.map(row => row.humidity);
            humChart.update();

            accidentChart.data.labels = accidentTable.map(row => row.occurred_at);
            accidentChart.data.datasets[0].data = accidentTable.map(row => ({
                x: toISO(row.occurred_at),
                y: 1
            }));
            // 事故種別参照用にデータもセット
            accidentChart.data.datasets[0].accidentTable = accidentTable;
            accidentChart.update();

            // --- x軸範囲・目盛り設定 ---
            let xMin = null, xMax = null, xTicks = {};
            if (range === 'day') {
                // その日の00:00～23:59、24分割
                const d = date ? new Date(date) : new Date();
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                xMin = `${yyyy}-${mm}-${dd}T00:00:00`;
                xMax = `${yyyy}-${mm}-${dd}T23:59:59`;
                xTicks = {
                    stepSize: 1,
                    source: 'auto',
                    autoSkip: false,
                    maxTicksLimit: 24,
                    callback: function(value, index, ticks) {
                        // 0時, 6時, 12時, 18時, 23時だけラベル
                        const hour = new Date(value).getHours();
                        return [0, 6, 12, 18, 23].includes(hour) ? `${hour}:00` : '';
                    }
                };
            } else if (range === 'week') {
                // 日曜00:00～金曜23:59、7分割
                const d = date ? new Date(date) : new Date();
                // 日曜取得
                const day = d.getDay();
                const sunday = new Date(d);
                sunday.setDate(d.getDate() - day);
                const friday = new Date(sunday);
                friday.setDate(sunday.getDate() + 6);
                const yyyyS = sunday.getFullYear(), mmS = String(sunday.getMonth() + 1).padStart(2, '0'), ddS = String(sunday.getDate()).padStart(2, '0');
                const yyyyF = friday.getFullYear(), mmF = String(friday.getMonth() + 1).padStart(2, '0'), ddF = String(friday.getDate()).padStart(2, '0');
                xMin = `${yyyyS}-${mmS}-${ddS}T00:00:00`;
                xMax = `${yyyyF}-${mmF}-${ddF}T23:59:59`;
                xTicks = {
                    stepSize: 1,
                    source: 'auto',
                    autoSkip: false,
                    maxTicksLimit: 7,
                    callback: function(value, index, ticks) {
                        // 日付ラベル
                        const d = new Date(value);
                        return `${d.getMonth() + 1}/${d.getDate()}`;
                    }
                };
            } else if (range === 'month') {
                // 1日0:00～月末23:59、10分割
                const d = date ? new Date(date) : new Date();
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const first = `${yyyy}-${mm}-01T00:00:00`;
                // 月末日取得
                const lastDate = new Date(yyyy, d.getMonth() + 1, 0).getDate();
                const last = `${yyyy}-${mm}-${String(lastDate).padStart(2, '0')}T23:59:59`;
                xMin = first;
                xMax = last;
                xTicks = {
                    stepSize: 1,
                    source: 'auto',
                    autoSkip: false,
                    maxTicksLimit: 10,
                    callback: function(value, index, ticks) {
                        // 10分割
                        const d = new Date(value);
                        return `${d.getMonth() + 1}/${d.getDate()}`;
                    }
                };
            } else if (range === 'all') {
                // データ範囲、5分割、下に日にち
                let allDates = data
                    .map(row => row.measured_at)
                    .filter(Boolean)
                    .map(d => new Date(d))
                    .sort((a, b) => a - b);
                if (allDates.length === 0) {
                    xMin = null; xMax = null;
                } else {
                    xMin = allDates[0].toISOString();
                    xMax = allDates[allDates.length - 1].toISOString();
                }
                xTicks = {
                    stepSize: 1,
                    source: 'auto',
                    autoSkip: false,
                    maxTicksLimit: 5,
                    callback: function(value, index, ticks) {
                        // 日付のみ
                        const d = new Date(value);
                        return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
                    }
                };
            }

            // xMin, xMax をDate型にして±余白
            if (xMin && xMax) {
                const minDate = new Date(xMin);
                const maxDate = new Date(xMax);
                // 余白: 全体の2%（最低10分, 最大1日まで）
                const diff = maxDate - minDate;
                let pad = Math.max(10 * 60 * 1000, Math.min(diff * 0.02, 24 * 60 * 60 * 1000));
                xMin = new Date(minDate.getTime() - pad).toISOString();
                xMax = new Date(maxDate.getTime() + pad).toISOString();
            }

            // x軸設定を全グラフに適用
            function setXOptions(chart) {
                if (!chart) return;
                chart.options.scales.x.min = xMin || undefined;
                chart.options.scales.x.max = xMax || undefined;
                chart.options.scales.x.ticks = xTicks;
                chart.update();
            }
            setXOptions(congestionChart);
            setXOptions(pressureChart);
            setXOptions(tempChart);
            setXOptions(humChart);
            setXOptions(accidentChart); // ← 事故情報グラフも同じx軸設定が適用されます
        }
        // CSVダウンロード
        async function downloadCSV() {
            const result = await fetch('/api/history').then(r => r.json());
            const data = result.data || result; // 互換
            let csv = '階/デバイス,混雑度,気圧,温度,湿度,時刻\n';
            csv += data.map(row => `${row.device_id || row.floor_number},${row.congestion_level || ''},${row.pressure || ''},${row.temperature || ''},${row.humidity || ''},${row.measured_at}`).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'history.csv';
            a.click();
        }
        // 初期ロード
        // 今日の日付をデフォルトでセット
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('rangeSelect').value = 'day';
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('dateInput').value = `${yyyy}-${mm}-${dd}`;
            initCharts();
            fetchRealtime();
            fetchHistory();
            setInterval(fetchRealtime, 5000);
        });
    </script>
</body>

</html>
