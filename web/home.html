<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>エレベーター管理システム</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --main-bg: #f7f9fb;
            --card-bg: #fff;
            --accent: #1976d2;
            --accent-light: #e3f2fd;
            --border: #e0e0e0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', 'Meiryo', sans-serif;
            margin: 0;
            background: var(--main-bg);
            color: #222;
        }

        h1 {
            margin: 0 0 24px 0;
            padding: 32px 0 16px 0;
            text-align: center;
            background: linear-gradient(90deg, var(--accent-light) 0%, #fff 100%);
            color: var(--accent);
            font-size: 2.2rem;
            letter-spacing: 2px;
            box-shadow: var(--shadow);
        }

        h2 {
            margin-top: 40px;
            color: var(--accent);
            font-size: 1.4rem;
            border-left: 6px solid var(--accent);
            padding-left: 12px;
            margin-left: 20px;
        }

        h4 {
            color: #333;
            margin-top: 10px;
            margin-bottom: 10px;
            text-align: center;
        }

        /* グラフエリアのレイアウト調整 */
        .chart-section {
            padding: 0 20px;
        }

        .chart-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* グラフのサイズ固定用コンテナ */
        .chart-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 15px;
            border: 1px solid var(--border);
            /* 固定サイズの設定 */
            width: 450px; 
            height: 300px;
            position: relative;
        }

        /* 2段目（3つ並び）用のサイズ微調整 */
        .chart-row-2 .chart-container {
            width: 380px;
            height: 280px;
        }

        canvas {
            width: 100% !important;
            height: calc(100% - 40px) !important; /* タイトル分を引く */
        }

        .realtime {
            display: flex;
            gap: 32px;
            margin: 20px;
            flex-wrap: wrap;
        }

        .realtime>div {
            flex: 1;
            min-width: 320px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
            border: 1px solid var(--border);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
        }

        th, td {
            border-bottom: 1px solid var(--border);
            padding: 10px 8px;
            text-align: center;
        }

        th {
            background: var(--accent-light);
            color: var(--accent);
        }

        .scrollable-table {
            max-height: 340px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .download-btn {
            margin: 0 0 20px 20px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 10px 28px;
            cursor: pointer;
        }

        #tableArea {
            margin: 20px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        select, input[type="date"] {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            margin: 0 10px;
        }
    </style>
</head>

<body>
    <h1>エレベーター管理システム</h1>

    <h2>リアルタイム情報</h2>
    <div class="realtime">
        <div>
            <h3>各階の最新混雑度</h3>
            <div class="scrollable-table">
                <table id="congestion-table">
                    <thead>
                        <tr><th>階</th><th>混雑度</th><th>時刻</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div>
            <h3>最新エレベーター環境</h3>
            <div class="scrollable-table">
                <table id="env-table">
                    <thead>
                        <tr><th>デバイス</th><th>気圧</th><th>温度</th><th>湿度</th><th>時刻</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <h2>過去データ</h2>
    <button class="download-btn" onclick="downloadCSV()">CSVダウンロード</button>
    
    <div style="margin-left: 20px; margin-bottom: 20px;">
        <label>表示範囲:
            <select id="rangeSelect" onchange="fetchHistory()">
                <option value="day">日</option>
                <option value="week">週</option>
                <option value="month">月</option>
                <option value="all">全期間</option>
            </select>
            <input type="date" id="dateInput" onchange="fetchHistory()">
        </label>
    </div>

    <div class="chart-section">
        <div class="chart-row">
            <div class="chart-container">
                <h4>混雑度</h4>
                <canvas id="congestionChart"></canvas>
            </div>
            <div class="chart-container">
                <h4>事故情報</h4>
                <canvas id="accidentChart"></canvas>
            </div>
        </div>

        <div class="chart-row chart-row-2">
            <div class="chart-container">
                <h4>気圧</h4>
                <canvas id="pressureChart"></canvas>
            </div>
            <div class="chart-container">
                <h4>温度</h4>
                <canvas id="tempChart"></canvas>
            </div>
            <div class="chart-container">
                <h4>湿度</h4>
                <canvas id="humChart"></canvas>
            </div>
        </div>
    </div>

    <div id="tableArea">
        <h4>履歴テーブル</h4>
        <div id="congestionTableContainer" class="scrollable-table" style="margin-bottom:20px;"></div>
        <div id="environmentTableContainer" class="scrollable-table" style="margin-bottom:20px;"></div>
        <div id="accidentTableContainer" class="scrollable-table"></div>
    </div>

    <script>
        // --- 共通設定 ---
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false, // コンテナのサイズに合わせる
            scales: {
                x: { type: 'time' }
            },
            plugins: {
                legend: { position: 'top' }
            }
        };

        function toISO(dt) { return dt ? dt.replace(' ', 'T') : dt; }
        function getColor(i) { return `hsl(${(i * 45) % 360} 75% 45%)`; }

        // グラフ初期化
        let congestionChart, pressureChart, tempChart, humChart, accidentChart;

        function initCharts() {
            const chartConfigs = [
                { id: 'congestionChart', type: 'line', color: 'blue', label: '混雑度' },
                { id: 'pressureChart', type: 'line', color: 'green', label: '気圧' },
                { id: 'tempChart', type: 'line', color: 'red', label: '温度' },
                { id: 'humChart', type: 'line', color: 'purple', label: '湿度' }
            ];

            congestionChart = new Chart(document.getElementById('congestionChart'), {
                type: 'line',
                data: { datasets: [] },
                options: { 
                    ...commonOptions,
                    scales: { ...commonOptions.scales, y: { min: 0, max: 1 } }
                }
            });

            accidentChart = new Chart(document.getElementById('accidentChart'), {
                type: 'scatter',
                data: { datasets: [{ label: '事故件数', backgroundColor: 'orange', pointRadius: 6 }] },
                options: {
                    ...commonOptions,
                    scales: { ...commonOptions.scales, y: { beginAtZero: true, suggestedMax: 1, ticks: { stepSize: 1 } } }
                }
            });

            pressureChart = new Chart(document.getElementById('pressureChart'), {
                type: 'line',
                data: { datasets: [{ label: '気圧', borderColor: 'green' }] },
                options: commonOptions
            });

            tempChart = new Chart(document.getElementById('tempChart'), {
                type: 'line',
                data: { datasets: [{ label: '温度', borderColor: 'red' }] },
                options: commonOptions
            });

            humChart = new Chart(document.getElementById('humChart'), {
                type: 'line',
                data: { datasets: [{ label: '湿度', borderColor: 'purple' }] },
                options: commonOptions
            });
        }

        // 既存のデータ取得・更新ロジック (fetchRealtime, fetchHistory, downloadCSV) は
        // 基本的にそのまま利用可能です。
        // setXOptions 内の chart.update() も正常に動作します。
        
        async function fetchRealtime() {
            try {
                const [congestion, env] = await Promise.all([
                    fetch('/api/congestion/latest').then(r => r.json()),
                    fetch('/api/environment/latest').then(r => r.json())
                ]);
                const ct = document.querySelector('#congestion-table tbody');
                ct.innerHTML = congestion.map(row => `<tr><td>${row.floor_number}</td><td>${row.congestion_level}</td><td>${row.measured_at}</td></tr>`).join('');
                const et = document.querySelector('#env-table tbody');
                et.innerHTML = env.map(row => `<tr><td>${row.device_id}</td><td>${row.pressure}</td><td>${row.temperature}</td><td>${row.humidity}</td><td>${row.measured_at}</td></tr>`).join('');
            } catch(e) { console.error("Realtime fetch error", e); }
        }

        async function fetchHistory() {
            const range = document.getElementById('rangeSelect').value;
            const date = document.getElementById('dateInput').value;
            let url = `/api/history?range=${range}&date=${date}`;
            
            try {
                const res = await fetch(url);
                const result = await res.json();
                const data = result.data;

                // --- グラフ更新ロジック (提供されたコードの移植) ---
                const congestion = data.filter(row => row.congestion_level != null);
                const envData = data.filter(row => row.pressure != null);
                const accidents = data.filter(row => row.accident_type != null);

                // 混雑度
                const groups = {};
                congestion.forEach(r => {
                    const k = r.floor_number !== undefined ? `階 ${r.floor_number}` : (r.device_id || 'unknown');
                    groups[k] = groups[k] || [];
                    groups[k].push({ x: toISO(r.measured_at), y: Number(r.congestion_level) });
                });
                congestionChart.data.datasets = Object.keys(groups).map((k, i) => ({
                    label: k, data: groups[k].sort((a,b) => new Date(a.x)-new Date(b.x)), borderColor: getColor(i)
                }));
                congestionChart.update();

                // 環境
                pressureChart.data.datasets[0].data = envData.map(r => ({ x: toISO(r.measured_at), y: r.pressure }));
                tempChart.data.datasets[0].data = envData.map(r => ({ x: toISO(r.measured_at), y: r.temperature }));
                humChart.data.datasets[0].data = envData.map(r => ({ x: toISO(r.measured_at), y: r.humidity }));
                [pressureChart, tempChart, humChart].forEach(c => c.update());

                // 事故
                accidentChart.data.datasets[0].data = accidents.map(r => ({ x: toISO(r.occurred_at), y: 1 }));
                accidentChart.update();

                // テーブル更新
                document.getElementById('congestionTableContainer').innerHTML = `<table><tr><th>時刻</th><th>混雑度</th></tr>` + congestion.map(r => `<tr><td>${r.measured_at}</td><td>${r.congestion_level}</td></tr>`).join('') + `</table>`;
                document.getElementById('environmentTableContainer').innerHTML = `<table><tr><th>時刻</th><th>温度</th><th>湿度</th></tr>` + envData.map(r => `<tr><td>${r.measured_at}</td><td>${r.temperature}</td></tr>`).join('') + `</table>`;
                
            } catch(e) { console.error("History fetch error", e); }
        }

        async function downloadCSV() {
            const result = await fetch('/api/history').then(r => r.json());
            const data = result.data || [];
            let csv = '階/デバイス,混雑度,気圧,温度,湿度,時刻\n';
            csv += data.map(row => `${row.device_id || row.floor_number},${row.congestion_level || ''},${row.pressure || ''},${row.temperature || ''},${row.humidity || ''},${row.measured_at}`).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'history.csv';
            a.click();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateInput').value = today;
            initCharts();
            fetchRealtime();
            fetchHistory();
            setInterval(() => { fetchRealtime(); fetchHistory(); }, 10000);
        });
    </script>
</body>
</html>
