<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>エレベーター管理システム</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --main-bg: #f7f9fb;
            --card-bg: #fff;
            --accent: #1976d2;
            --accent-light: #e3f2fd;
            --border: #e0e0e0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            --radius: 12px;
        }
        body { font-family: 'Segoe UI', 'Meiryo', sans-serif; margin: 0; background: var(--main-bg); color: #222; }
        h1 { margin: 0 0 24px 0; padding: 32px 0 16px 0; text-align: center; background: linear-gradient(90deg, var(--accent-light) 0%, #fff 100%); color: var(--accent); font-size: 2.2rem; letter-spacing: 2px; box-shadow: var(--shadow); }
        h2 { margin-top: 40px; color: var(--accent); font-size: 1.4rem; border-left: 6px solid var(--accent); padding-left: 12px; margin-left: 20px; }
        h4 { color: #333; margin: 10px 0; text-align: center; }
        .chart-section { padding: 0 20px; }
        .chart-row { display: flex; gap: 20px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .chart-container { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px; border: 1px solid var(--border); width: 450px; height: 300px; position: relative; }
        .chart-row-2 .chart-container { width: 380px; height: 280px; }
        canvas { width: 100% !important; height: calc(100% - 40px) !important; }
        .realtime { display: flex; gap: 32px; margin: 20px; flex-wrap: wrap; }
        .realtime>div { flex: 1; min-width: 320px; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; border: 1px solid var(--border); }
        table { border-collapse: separate; border-spacing: 0; width: 100%; background: #fff; border-radius: var(--radius); overflow: hidden; }
        th, td { border-bottom: 1px solid var(--border); padding: 10px 8px; text-align: center; }
        th { background: var(--accent-light); color: var(--accent); }
        .scrollable-table { max-height: 340px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
        .no-data { padding: 30px; text-align: center; color: #888; background: #fafafa; font-style: italic; }
        
        /* ボタン群のスタイル */
        .btn-group { margin: 0 0 20px 20px; display: flex; gap: 10px; }
        .download-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 10px 20px; cursor: pointer; transition: 0.2s; }
        .download-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        /* 色分け */
        .btn-cong { background: #1976d2; }
        .btn-env { background: #2e7d32; }
        .btn-acc { background: #e65100; }

        #tableArea { margin: 20px; padding: 20px; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
        select, input[type="date"] { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin: 0 10px; }
    </style>
</head>
<body>
    <h1>エレベーター管理システム</h1>

    <h2>リアルタイム情報</h2>
    <div class="realtime">
        <div>
            <h3>各階の最新混雑度</h3>
            <div class="scrollable-table">
                <table id="congestion-table"><thead><tr><th>階</th><th>混雑度</th><th>時刻</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
        <div>
            <h3>最新エレベーター環境</h3>
            <div class="scrollable-table">
                <table id="env-table"><thead><tr><th>デバイス</th><th>気圧</th><th>温度</th><th>湿度</th><th>時刻</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
    </div>

    <h2>過去データ</h2>
    
    <div class="btn-group">
        <button class="download-btn btn-cong" onclick="downloadCSV('congestion')">混雑度CSV</button>
        <button class="download-btn btn-env" onclick="downloadCSV('environment')">環境データCSV</button>
        <button class="download-btn btn-acc" onclick="downloadCSV('accident')">事故情報CSV</button>
    </div>
    
    <div style="margin-left: 20px; margin-bottom: 20px;">
        <label>表示範囲:
            <select id="rangeSelect" onchange="fetchHistory()">
                <option value="day">日</option>
                <option value="week">週</option>
                <option value="month">月</option>
                <option value="all">全期間</option>
            </select>
            <input type="date" id="dateInput" onchange="fetchHistory()">
        </label>
    </div>

    <div class="chart-section">
        <div class="chart-row">
            <div class="chart-container"><h4>混雑度</h4><canvas id="congestionChart"></canvas></div>
            <div class="chart-container"><h4>事故情報</h4><canvas id="accidentChart"></canvas></div>
        </div>
        <div class="chart-row chart-row-2">
            <div class="chart-container"><h4>気圧</h4><canvas id="pressureChart"></canvas></div>
            <div class="chart-container"><h4>温度</h4><canvas id="tempChart"></canvas></div>
            <div class="chart-container"><h4>湿度</h4><canvas id="humChart"></canvas></div>
        </div>
    </div>

    <div id="tableArea">
        <h4>履歴テーブル</h4>
        <div id="congestionTableContainer" class="scrollable-table" style="margin-bottom:20px;"></div>
        <div id="environmentTableContainer" class="scrollable-table" style="margin-bottom:20px;"></div>
        <div id="accidentTableContainer" class="scrollable-table"></div>
    </div>

<script>
    const commonOptions = { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'time' } }, plugins: { legend: { position: 'top' } } };
    function toISO(dt) { return dt ? dt.replace(' ', 'T') : dt; }
    function getColor(i) { return `hsl(${(i * 45) % 360} 75% 45%)`; }
    function fmtDate(dt) { return dt ? new Date(dt).toLocaleString('ja-JP') : '-'; }
    let congestionChart, pressureChart, tempChart, humChart, accidentChart;

    function initCharts() {
        const ctxCong = document.getElementById('congestionChart').getContext('2d');
        const ctxAcc = document.getElementById('accidentChart').getContext('2d');
        const ctxPress = document.getElementById('pressureChart').getContext('2d');
        const ctxTemp = document.getElementById('tempChart').getContext('2d');
        const ctxHum = document.getElementById('humChart').getContext('2d');
        congestionChart = new Chart(ctxCong, { type: 'line', data: { datasets: [] }, options: { ...commonOptions, scales: { ...commonOptions.scales, y: { min: 0, max: 1 } } } });
        accidentChart = new Chart(ctxAcc, { type: 'scatter', data: { datasets: [{ label: '事故件数', backgroundColor: 'orange', pointRadius: 6 }] }, options: { ...commonOptions, scales: { ...commonOptions.scales, y: { beginAtZero: true, suggestedMax: 1, ticks: { stepSize: 1 } } } } });
        pressureChart = new Chart(ctxPress, { type: 'line', data: { datasets: [{ label: '気圧', borderColor: 'green' }] }, options: commonOptions });
        tempChart = new Chart(ctxTemp, { type: 'line', data: { datasets: [{ label: '温度', borderColor: 'red' }] }, options: commonOptions });
        humChart = new Chart(ctxHum, { type: 'line', data: { datasets: [{ label: '湿度', borderColor: 'purple' }] }, options: commonOptions });
    }

    async function fetchRealtime() {
        try {
            const [cong, env] = await Promise.all([
                fetch('/api/congestion/latest').then(r => r.json()),
                fetch('/api/environment/latest').then(r => r.json())
            ]);
            document.querySelector('#congestion-table tbody').innerHTML = cong.map(r => `<tr><td>${r.floor_number}</td><td>${Number(r.congestion_level).toFixed(2)}</td><td>${fmtDate(r.measured_at)}</td></tr>`).join('');
            document.querySelector('#env-table tbody').innerHTML = env.map(r => `<tr><td>${r.device_id}</td><td>${r.pressure}</td><td>${r.temperature}</td><td>${r.humidity}</td><td>${fmtDate(r.measured_at)}</td></tr>`).join('');
        } catch(e) { console.error(e); }
    }

    // 履歴データ保持用（CSV出力で再利用）
    let currentHistoryData = [];

    async function fetchHistory() {
        const range = document.getElementById('rangeSelect').value;
        const date = document.getElementById('dateInput').value;
        
        try {
            const res = await fetch(`/api/history?range=${range}&date=${date}`);
            const result = await res.json();
            const data = result.data || [];
            currentHistoryData = data; // グローバル変数に保存

            // サーバー側で rec_type を付けたので、それでフィルタリングする
            const congData = data.filter(r => r.rec_type === 'CONGESTION');
            const envData = data.filter(r => r.rec_type === 'ENVIRONMENT');
            const accData = data.filter(r => r.rec_type === 'ACCIDENT');

            // 1. 混雑度テーブル
            const congCont = document.getElementById('congestionTableContainer');
            if(congData.length===0) congCont.innerHTML = '<div class="no-data">データなし</div>';
            else congCont.innerHTML = `<table><thead><tr><th>階/デバイス</th><th>混雑度</th><th>時刻</th></tr></thead><tbody>${congData.map(r=>`<tr><td>${r.floor_number?r.floor_number+'階':r.device_id}</td><td>${Number(r.congestion_level).toFixed(2)}</td><td>${fmtDate(r.measured_at)}</td></tr>`).join('')}</tbody></table>`;

            // 2. 環境テーブル
            const envCont = document.getElementById('environmentTableContainer');
            if(envData.length===0) envCont.innerHTML = '<div class="no-data">データなし</div>';
            else envCont.innerHTML = `<table><thead><tr><th>デバイス</th><th>気圧</th><th>温度</th><th>湿度</th><th>時刻</th></tr></thead><tbody>${envData.map(r=>`<tr><td>${r.device_id}</td><td>${Number(r.pressure).toFixed(1)}</td><td>${Number(r.temperature).toFixed(1)}</td><td>${Number(r.humidity).toFixed(1)}</td><td>${fmtDate(r.measured_at)}</td></tr>`).join('')}</tbody></table>`;

            // 3. 事故テーブル
            const accCont = document.getElementById('accidentTableContainer');
            if(accData.length===0) accCont.innerHTML = '<div class="no-data">データなし</div>';
            else accCont.innerHTML = `<table><thead><tr><th>デバイス</th><th>事故種別</th><th>発生時刻</th></tr></thead><tbody>${accData.map(r=>`<tr><td>${r.device_id}</td><td>${r.accident_type}</td><td>${fmtDate(r.occurred_at)}</td></tr>`).join('')}</tbody></table>`;

            // グラフ更新
            updateCharts(congData, envData, accData);

        } catch(e) { console.error("History fetch error", e); }
    }

    function updateCharts(congData, envData, accData) {
        // 混雑度グラフ
        const groups = {};
        congData.forEach(r => {
            const k = r.floor_number !== undefined ? `階 ${r.floor_number}` : (r.device_id || 'unknown');
            groups[k] = groups[k] || [];
            groups[k].push({ x: toISO(r.measured_at), y: Number(r.congestion_level) });
        });
        congestionChart.data.datasets = Object.keys(groups).map((k, i) => ({
            label: k, data: groups[k].sort((a,b)=>new Date(a.x)-new Date(b.x)), borderColor: getColor(i)
        }));
        congestionChart.update();

        // 環境グラフ
        pressureChart.data.datasets[0].data = envData.map(r => ({ x: toISO(r.measured_at), y: r.pressure }));
        tempChart.data.datasets[0].data = envData.map(r => ({ x: toISO(r.measured_at), y: r.temperature }));
        humChart.data.datasets[0].data = envData.map(r => ({ x: toISO(r.measured_at), y: r.humidity }));
        [pressureChart, tempChart, humChart].forEach(c => c.update());

        // 事故グラフ
        accidentChart.data.datasets[0].data = accData.map(r => ({ x: toISO(r.occurred_at), y: 1 }));
        accidentChart.update();
    }

    // ★★★ CSV分割ダウンロード機能 ★★★
    function downloadCSV(type) {
        if (!currentHistoryData || currentHistoryData.length === 0) {
            alert("データがありません");
            return;
        }

        let csv = '';
        let fileName = '';
        let filteredData = [];

        // タイプごとのカラム定義とデータ抽出
        if (type === 'congestion') {
            fileName = 'congestion_log.csv';
            filteredData = currentHistoryData.filter(d => d.rec_type === 'CONGESTION');
            csv = '時刻,デバイスID,階数,混雑度\n';
            csv += filteredData.map(r => 
                `${fmtDate(r.measured_at)},${r.device_id},${r.floor_number},${Number(r.congestion_level).toFixed(2)}`
            ).join('\n');

        } else if (type === 'environment') {
            fileName = 'environment_log.csv';
            filteredData = currentHistoryData.filter(d => d.rec_type === 'ENVIRONMENT');
            csv = '時刻,デバイスID,気圧,温度,湿度\n';
            csv += filteredData.map(r => 
                `${fmtDate(r.measured_at)},${r.device_id},${Number(r.pressure).toFixed(1)},${Number(r.temperature).toFixed(1)},${Number(r.humidity).toFixed(1)}`
            ).join('\n');

        } else if (type === 'accident') {
            fileName = 'accident_log.csv';
            filteredData = currentHistoryData.filter(d => d.rec_type === 'ACCIDENT');
            csv = '発生時刻,デバイスID,事故種別\n';
            csv += filteredData.map(r => 
                `${fmtDate(r.occurred_at)},${r.device_id},${r.accident_type}`
            ).join('\n');
        }

        if (filteredData.length === 0) {
            alert("指定されたデータがありません");
            return;
        }

        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
    }

    window.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateInput').value = today;
        initCharts();
        fetchRealtime();
        fetchHistory();
        setInterval(() => { fetchRealtime(); fetchHistory(); }, 10000);
    });
</script>
</body>
</html>
